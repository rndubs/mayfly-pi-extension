name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: test · typecheck · build · smoke (pi ${{ matrix.pi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version we run locally, plus whatever is newest (catches upcoming breakage).
        pi: ["1.4.0", "latest"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dev deps + Pi ${{ matrix.pi }}
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund "@earendil-works/pi-coding-agent@${{ matrix.pi }}"
          npx pi --version || true

      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - name: Assemble release tree
        run: node scripts/assemble-dist.mjs _dist

      - name: Smoke test (load built extension in real pi)
        run: scripts/smoke.sh _dist/index.js "$(pwd)/node_modules/.bin/pi"

  integration:
    name: integration (local Mayfly server @ ${{ matrix.mayfly }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pinned Mayfly server commit (github.com/josharian/mayfly main as of 2026-11-07).
        mayfly: ["06dd34e918f651e1a8b86531bd3ef1815a4d6a4e"]
    steps:
      - uses: actions/checkout@v7

      - name: Check out the Mayfly server source
        uses: actions/checkout@v7
        with:
          repository: josharian/mayfly
          ref: ${{ matrix.mayfly }}
          path: _mayfly
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: _mayfly/go.mod
          cache-dependency-path: _mayfly/go.sum

      - name: Build the Mayfly server
        working-directory: _mayfly
        run: go build -o "$RUNNER_TEMP/mayfly" ./cmd/mayfly

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The extension wiring tests load index.ts, which needs Pi and typebox.
      - name: Install dev deps + Pi
        run: npm install --no-audit --no-fund

      - name: Integration tests (core and extension wiring against a real server)
        env:
          MAYFLY_SERVER_BIN: ${{ runner.temp }}/mayfly
          MAYFLY_REQUIRE_SERVER: "1"
        run: npm run test:integration
